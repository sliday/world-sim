name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@12.0.2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run check
